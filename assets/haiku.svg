<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Rotating haiku about code, bugs and learning">
<style>.j{font-size:30px;fill:#F3EBDD;font-family:'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','MS PMincho',Georgia,serif;letter-spacing:8px}.en{font-size:14px;fill:#C9A24B;font-style:italic;font-family:Georgia,serif}.h{opacity:0;animation:c 18s ease-in-out infinite}@keyframes c{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-10px)}}.b{animation:bl 5s ease-in-out infinite}@keyframes bl{50%{opacity:.5}}</style>
<rect width="900" height="260" rx="10" fill="#10121C" stroke="#2B3A67"/>
<rect x="60" y="30" width="3" height="200" fill="#D9333F" class="b"/><rect x="837" y="30" width="3" height="200" fill="#D9333F" class="b"/>
<circle cx="800" cy="60" r="18" fill="#D9333F" opacity=".85"/><g class="h" style="animation-delay:0s"><text x="450" y="95" text-anchor="middle" class="j">夜明けの空</text><text x="450" y="135" text-anchor="middle" class="j">一行ずつ</text><text x="450" y="175" text-anchor="middle" class="j">未来を書く</text><text x="450" y="218" text-anchor="middle" class="en">Dawn sky — line by line, I write the future</text></g><g class="h" style="animation-delay:6s"><text x="450" y="95" text-anchor="middle" class="j">桜散る</text><text x="450" y="135" text-anchor="middle" class="j">バグも静かに</text><text x="450" y="175" text-anchor="middle" class="j">消えてゆく</text><text x="450" y="218" text-anchor="middle" class="en">Sakura fall — even the bugs fade quietly</text></g><g class="h" style="animation-delay:12s"><text x="450" y="95" text-anchor="middle" class="j">学びの道</text><text x="450" y="135" text-anchor="middle" class="j">終わりはなくて</text><text x="450" y="175" text-anchor="middle" class="j">春が来る</text><text x="450" y="218" text-anchor="middle" class="en">The path of learning has no end — spring arrives</text></g></svg>