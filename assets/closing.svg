<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 356" width="888" height="356" role="img" aria-label="Fall seven times, stand up eight. Let's build the future. Open to meaningful AI projects, hackathons and collaboration.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D1830"/><stop offset="1" stop-color="#120F1B"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9333F"/><stop offset=".6" stop-color="#FFB7C5"/><stop offset="1" stop-color="#FFB7C5" stop-opacity="0"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m"><rect x="0" y="230" width="860" height="90" fill="url(#fade)"/></mask>
  <pattern id="wave" width="40" height="20" patternUnits="userSpaceOnUse"><g fill="none" stroke="#FFB7C5" stroke-width="1">
    <circle cx="0" cy="20" r="20"/><circle cx="0" cy="20" r="14"/><circle cx="0" cy="20" r="8"/>
    <circle cx="40" cy="20" r="20"/><circle cx="40" cy="20" r="14"/><circle cx="40" cy="20" r="8"/>
    <circle cx="20" cy="10" r="20"/><circle cx="20" cy="10" r="14"/><circle cx="20" cy="10" r="8"/></g></pattern>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFB7C5" flood-opacity=".14"/></filter>
  <clipPath id="c"><rect width="860" height="320" rx="16"/></clipPath>
</defs>
<g transform="translate(14,10)">
<rect width="860" height="320" rx="16" fill="url(#bg)" filter="url(#sh)"/>
<g clip-path="url(#c)">
  <g mask="url(#m)"><rect y="230" width="860" height="90" fill="url(#wave)" opacity=".16"/></g>
  <text x="838" y="294" text-anchor="end" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="180" fill="#FFB7C5" fill-opacity=".06">縁</text>
  <rect width="860" height="3" fill="url(#edge)"/>
</g>
<rect x=".5" y=".5" width="859" height="319" rx="16" fill="none" stroke="#FFB7C5" stroke-opacity=".18"/>
<text x="430.0" y="108" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="54" font-weight="700" fill="#F3E9DC" fill-opacity="1" text-anchor="middle" letter-spacing="10">七転び八起き</text>
<text x="430.0" y="142" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="15" font-weight="400" fill="#A99FB5" fill-opacity="1" text-anchor="middle" letter-spacing="0" font-style="italic">Fall seven times, stand up eight.</text>
<rect x="280.0" y="168" width="130" height="1.5" fill="#D9333F"/><rect x="450.0" y="168" width="130" height="1.5" fill="#D9333F"/>
<path d="M0 0 C4 -5 10 -2 8 4 C6 9 1 8 0 0Z" fill="#FFB7C5" fill-opacity="0.9" transform="translate(424.0,164) scale(1.2)"/>
<text x="430.0" y="216" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="28" font-weight="700" fill="#FFB7C5" fill-opacity="1" text-anchor="middle" letter-spacing="4">一緒に未来を創ろう。</text>
<text x="430.0" y="242" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="14" font-weight="400" fill="#A99FB5" fill-opacity="1" text-anchor="middle" letter-spacing="0" font-style="italic">Let's build the future.</text>
<text x="430.0" y="286" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#D8CFDD" fill-opacity="0.8" text-anchor="middle" letter-spacing="2">OPEN TO MEANINGFUL AI PROJECTS, HACKATHONS AND COLLABORATION</text>
<g transform="rotate(-6 796.0 52.0)"><rect x="774" y="30" width="44" height="44" rx="4" fill="#D9333F"/><rect x="777" y="33" width="38" height="38" rx="2" fill="none" stroke="#F3E9DC" stroke-opacity=".55"/><text x="796.0" y="61.68" text-anchor="middle" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="25.52" font-weight="700" fill="#F3E9DC">縁</text></g>
</g>
</svg>
