<text x="602" y="56" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="22" font-weight="700" fill="#FFB7C5" fill-opacity="0.65" text-anchor="middle" letter-spacing="0">探</text>
