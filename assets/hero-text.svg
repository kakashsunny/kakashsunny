<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 336" width="668" height="336" role="img" aria-label="K. Akash — AI generalist, builder, explorer. Continue learning, continue exploring.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D1830"/><stop offset="1" stop-color="#120F1B"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9333F"/><stop offset=".6" stop-color="#FFB7C5"/><stop offset="1" stop-color="#FFB7C5" stop-opacity="0"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m"><rect x="0" y="210" width="640" height="90" fill="url(#fade)"/></mask>
  <pattern id="wave" width="40" height="20" patternUnits="userSpaceOnUse"><g fill="none" stroke="#FFB7C5" stroke-width="1">
    <circle cx="0" cy="20" r="20"/><circle cx="0" cy="20" r="14"/><circle cx="0" cy="20" r="8"/>
    <circle cx="40" cy="20" r="20"/><circle cx="40" cy="20" r="14"/><circle cx="40" cy="20" r="8"/>
    <circle cx="20" cy="10" r="20"/><circle cx="20" cy="10" r="14"/><circle cx="20" cy="10" r="8"/></g></pattern>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFB7C5" flood-opacity=".14"/></filter>
  <clipPath id="c"><rect width="640" height="300" rx="16"/></clipPath>
</defs>
<g transform="translate(14,10)">
<rect width="640" height="300" rx="16" fill="url(#bg)" filter="url(#sh)"/>
<g clip-path="url(#c)">
  <g mask="url(#m)"><rect y="210" width="640" height="90" fill="url(#wave)" opacity=".16"/></g>
