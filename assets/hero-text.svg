<text x="36" y="226" font-family="'Shippori Mincho','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','MS PMincho',serif" font-size="28" font-weight="700" fill="#F3E9DC" fill-opacity="1" text-anchor="start" letter-spacing="3">学び続け、探求し続ける。</text>
