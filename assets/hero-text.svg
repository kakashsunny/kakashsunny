  <rect width="640" height="3" fill="url(#edge)"/>
</g>
<rect x=".5" y=".5" width="639" height="299" rx="16" fill="none" stroke="#FFB7C5" stroke-opacity=".18"/>
<rect x="0" y="34" width="4" height="64" fill="#D9333F"/>
